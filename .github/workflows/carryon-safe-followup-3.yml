name: Safe carry-on corrections 3
on:
  push:
    paths:
      - '.github/workflows/carryon-safe-followup-3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified safe corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/airlines.ts')
          s = p.read_text()
          reps = [
            (
              "personal: { rule: 'dimensions', w: 33, h: 45, d: 20, kg: 8, verified: true },",
              "personal: { rule: 'dimensions', w: 33, h: 45, d: 20, kg: 0, verified: true },"
            ),
            (
              "note: 'International Economy: 1 piece up to 7 kg. Premium Economy, Business and First: 2 pieces up to 7 kg each. Domestic and Dash 8 rules differ.'",
              "note: 'International Economy: 1 piece up to 7 kg. Premium Economy, Business and First: higher multi-piece allowances apply. Domestic and Dash 8 rules differ. On international flights departing India, additional personal items are not permitted; Economy allows 1 standard piece up to 7 kg and Business 1 standard piece up to 10 kg.'"
            ),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('Expected source text not found: ' + old[:160])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'carry-on-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/airlines.ts
          git diff --cached --check
          git commit -m 'data: correct Virgin Australia and Qantas carry-on notes'
          git push
