name: Fix IndiGo checked labels
on:
  push:
    paths:
      - '.github/workflows/fix-indigo-checked-labels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep checked allowance labels distinct
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/size-checker/SizeCheckerClient.tsx')
          s = p.read_text()
          old = "options: (CHECKED_VARIANTS[a.code] ?? []).map((v) => ({ id: v.id, label: pillShortLabel(v.label), selected: checkedVariantByCode[a.code] === v.id })),"
          new = "options: (CHECKED_VARIANTS[a.code] ?? []).map((v) => ({ id: v.id, label: v.label.replace(' · allowance', '').replace(' allowance', ''), selected: checkedVariantByCode[a.code] === v.id })),"
          if old not in s:
              raise SystemExit('Expected checked options mapping not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/size-checker/SizeCheckerClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep checked allowance labels distinct'
          git push
