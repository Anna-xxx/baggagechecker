name: Cleanup checker wording
on:
  push:
    paths:
      - '.github/workflows/cleanup-checker-wording.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace internal checker wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/airlines.ts')
          s = p.read_text()
          replacements = {
            'The free 40 × 30 × 20 cm bag belongs under the seat and is handled as Personal item in this checker.': 'Free personal item: 40 × 30 × 20 cm. Must fit under the seat.',
            'The included 40 × 30 × 20 cm underseat bag is handled as Personal item in this checker.': 'Included personal item: 40 × 30 × 20 cm. Must fit under the seat.',
            'The free 40 × 30 × 20 cm bag is handled as Personal item in this checker.': 'Free personal item: 40 × 30 × 20 cm. Must fit under the seat.',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/airlines.ts
          git diff --cached --quiet && exit 0
          git commit -m 'copy: remove internal checker wording'
          git push
