name: Round baggage checker output
on:
  push:
    paths:
      - '.github/workflows/round-checker-output.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Round displayed metric values
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/size-checker/SizeCheckerClient.tsx')
          s = p.read_text()
          old = "  const toDisp = (v: number, k: DimKey) => (metric ? v : Math.round(k === 'KG' || k === 'KGC' ? v * 2.205 : v / 2.54));"
          new = "  const toDisp = (v: number, k: DimKey) => (metric ? Math.round(v * 10) / 10 : Math.round(k === 'KG' || k === 'KGC' ? v * 2.205 : v / 2.54));"
          if old not in s:
              raise SystemExit('Expected toDisp line not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/size-checker/SizeCheckerClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: round baggage checker display values'
          git push
