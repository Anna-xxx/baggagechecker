name: Additional safe carry-on corrections
on:
  push:
    paths:
      - '.github/workflows/carryon-safe-followup-2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified carry-on corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/airlines.ts')
          s = p.read_text()
          reps = [
            (
              "personal: { rule: 'unknown', kg: 0, verified: false },\n    checked: { kg: 23, total: 157, eco: 23, biz: 32, bags: 'Fare and route dependent'",
              "personal: { rule: 'fitUnderSeat', kg: 0, verified: true },\n    checked: { kg: 23, total: 157, eco: 23, biz: 32, bags: 'Fare and route dependent'"
            ),
            (
              "personal: { rule: 'unknown', kg: 3, verified: false },\n    checked: { kg: 0, total: 158, eco: 0, biz: 0, bags: 'Weight allowance depends heavily on route'",
              "personal: { rule: 'unknown', kg: 3, verified: true },\n    checked: { kg: 0, total: 158, eco: 0, biz: 0, bags: 'Weight allowance depends heavily on route'"
            ),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('Expected source text not found: ' + old[:140])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'carry-on-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/airlines.ts
          git diff --cached --check
          git commit -m 'data: verify Delta and IndiGo personal-item rules'
          git push
