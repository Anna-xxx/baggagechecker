name: Next safe carry-on corrections
on:
  push:
    paths:
      - '.github/workflows/carryon-safe-followup.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified carry-on corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/airlines.ts')
          s = p.read_text()
          reps = [
            (
              "personal: { rule: 'dimensions', w: 25, h: 37.5, d: 12.5, kg: 1.5, verified: true },",
              "personal: { rule: 'dimensions', w: 25, h: 37.5, d: 12.5, kg: 1.5, linearCm: 75, verified: true },"
            ),
            (
              "personal: { rule: 'unknown', kg: 0, verified: false },\n    checked: { w: 75, h: 90, d: 43, kg: 23, total: 208, eco: 23, biz: 32, bags: 'Economy Light 0; Classic/Delight 1; Premium 2; Upper Class 2'",
              "personal: { rule: 'dimensions', w: 30, h: 40, d: 15, kg: 0, verified: true },\n    checked: { w: 75, h: 90, d: 43, kg: 23, total: 208, eco: 23, biz: 32, bags: 'Economy Light 0; Classic/Delight 1; Premium 2; Upper Class 2'"
            ),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('Expected source text not found: ' + old[:140])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'carry-on-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/airlines.ts
          git diff --cached --check
          git commit -m 'data: add verified personal-item limits'
          git push
