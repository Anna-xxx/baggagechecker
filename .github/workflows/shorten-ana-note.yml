name: Shorten ANA baggage note
on:
  push:
    paths:
      - '.github/workflows/shorten-ana-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten ANA note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/airlines.ts')
          s = p.read_text()
          old = "Standard rule for aircraft with 100+ seats: max 55 × 40 × 25 cm and 115 cm total. On aircraft with fewer than 100 seats, the stricter limit is 45 × 35 × 20 cm and 100 cm total. The 10 kg limit is combined across the carry-on bag and personal item."
          new = "Carry-on + personal item: 10 kg combined. Smaller aircraft may have stricter size limits."
          if old not in s:
              raise SystemExit('Expected ANA note not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/airlines.ts
          git diff --cached --quiet && exit 0
          git commit -m 'copy: simplify ANA carry-on note'
          git push
